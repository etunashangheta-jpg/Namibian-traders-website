<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Namibian Traders — Race Registration & Timing</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0F1330;
      --bg-alt:#161B3D;
      --card:#1B2148;
      --text:#F2EFE9;
      --text-dim:#9AA1C2;
      --gold:#E8A23D;
      --teal:#2FBF9F;
      --line:rgba(242,239,233,0.12);
      --radius:4px;
    }
    *{box-sizing:border-box; margin:0; padding:0;}
    html{scroll-behavior:smooth;}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:'IBM Plex Sans', sans-serif;
      line-height:1.5;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit; text-decoration:none;}
    .wrap{max-width:1180px; margin:0 auto; padding:0 32px;}
    
    .eyebrow{
      font-family:'IBM Plex Mono', monospace;
      font-size:12px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--teal);
      margin-bottom: 12px;
      display: block;
    }
    h1,h2,h3,h4{font-family:'Anton', sans-serif; font-weight:400; letter-spacing:.01em; text-transform:uppercase;}

    /* Header & Navigation */
    header{
      position:sticky; top:0; z-index:50;
      background:rgba(15,19,48,0.86);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    nav{
      display:flex; align-items:center; justify-content:space-between;
      padding:18px 32px;
      max-width:1180px; margin:0 auto;
    }
    .brand{display:flex; align-items:center; gap:10px;}
    .brand-mark{width:45px; height:45px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
    .brand-mark img{width:100%; height:100%; object-fit:contain; border-radius: var(--radius);}
    .brand-name{font-family:'Anton', sans-serif; font-size:18px; letter-spacing:0.05em;}
    .nav-links{display:flex; gap:24px; align-items:center;}
    .nav-links a:hover{color:var(--teal);}
    .btn-nav{background:var(--teal); color:var(--bg); padding:8px 16px; font-family:'Anton', sans-serif; border-radius:var(--radius); transition:opacity 0.2s;}
    .btn-nav:hover{opacity:0.9;}

    /* Hero Section */
    .hero{padding:100px 0 60px 0; text-align:center;}
    .hero h1{font-size:52px; line-height:1.1; margin-bottom:20px;}
    .hero h1 em{color:var(--gold); font-style:normal;}
    .hero p{font-size:18px; color:var(--text-dim); max-width:700px; margin:0 auto 30px auto;}
    .hero-btns{display:flex; gap:16px; justify-content:center;}
    .btn-primary{background:var(--gold); color:var(--bg); padding:14px 28px; font-family:'Anton', sans-serif; text-transform:uppercase; border-radius:var(--radius);}
    .btn-secondary{border:1px solid var(--line); padding:14px 28px; font-family:'Anton', sans-serif; text-transform:uppercase; border-radius:var(--radius); background:var(--bg-alt);}
    .btn-primary:hover{background:#f0b45b;}
    .btn-secondary:hover{background:var(--card);}

    /* Stats Grid */
    .stats-bar{display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; margin:40px 0; background:var(--bg-alt); padding:24px; border:1px solid var(--line); border-radius:var(--radius); text-align:center;}
    .stat-item text{display:block;}
    .stat-num{font-family:'Anton', sans-serif; font-size:32px; color:var(--gold);}
    .stat-lbl{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--text-dim); text-transform:uppercase;}

    /* Sections General */
    section{padding:8px 0; margin-bottom:60px;}
    .section-title{font-size:36px; margin-bottom:32px;}

    /* Live Board Table */
    .board-card{background:var(--card); border:1px solid var(--line); padding:24px; border-radius:var(--radius);}
    .live-table{width:100%; border-collapse:collapse; text-align:left; margin-top:16px;}
    .live-table th{font-family:'IBM Plex Mono', monospace; font-size:12px; text-transform:uppercase; color:var(--teal); padding:12px; border-bottom:1px solid var(--line);}
    .live-table td{padding:12px; border-bottom:1px solid rgba(242,239,233,0.05); font-size:15px;}
    .live-table tr:last-child td{border-bottom:none;}
    .table-note{font-size:13px; color:var(--text-dim); margin-top:16px; font-style:italic;}

    /* Steps Grid */
    .steps-grid{display:grid; grid-template-columns:repeat(5, 1fr); gap:16px;}
    .step-card{background:var(--bg-alt); border:1px solid var(--line); padding:20px; border-radius:var(--radius); position:relative;}
    .step-num{font-family:'Anton', sans-serif; font-size:24px; color:var(--line); margin-bottom:8px;}
    .step-card h3{font-size:18px; margin-bottom:8px; color:var(--gold);}
    .step-card p{font-size:14px; color:var(--text-dim);}

    /* Grid Layouts */
    .features-grid, .races-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:24px;}
    .feat-item{background:var(--bg-alt); border:1px solid var(--line); padding:24px; border-radius:var(--radius);}
    .feat-item h4{font-size:18px; color:var(--text); margin-bottom:8px;}
    .feat-item p{font-size:14px; color:var(--text-dim);}

    /* Race Cards */
    .race-card{background:var(--card); border:1px solid var(--line); padding:28px; border-radius:var(--radius); display:flex; flex-direction:column; justify-content:between;}
    .race-date{font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--teal); margin-bottom:6px;}
    .race-card h3{font-size:22px; margin-bottom:4px;}
    .race-loc{font-size:14px; color:var(--text-dim); margin-bottom:16px;}
    .race-tags{display:flex; gap:8px; margin-bottom:24px;}
    .tag{background:var(--bg-alt); border:1px solid var(--line); padding:4px 8px; font-size:12px; border-radius:2px; font-family:'IBM Plex Mono', monospace;}
    .btn-register{background:none; border:1px solid var(--gold); color:var(--gold); padding:10px; font-family:'Anton', sans-serif; text-transform:uppercase; text-align:center; width:100%; border-radius:var(--radius); cursor:pointer; transition:all 0.2s;}
    .btn-register:hover{background:var(--gold); color:var(--bg);}

    /* Footer */
    footer{background:var(--bg-alt); border-top:1px solid var(--line); padding:60px 0 30px 0; margin-top:80px; font-size:14px;}
    .footer-grid{display:grid; grid-template-columns:2fr repeat(3, 1fr); gap:40px; margin-bottom:40px;}
    .footer-brand h4{font-size:20px; margin-bottom:12px;}
    .footer-col h5{font-family:'IBM Plex Mono', monospace; font-size:12px; text-transform:uppercase; color:var(--teal); margin-bottom:16px;}
    .footer-col ul{list-style:none;}
    .footer-col li{margin-bottom:10px; color:var(--text-dim);}
    .footer-col a:hover{color:var(--text);}
    .footer-bottom{border-top:1px solid var(--line); padding-top:20px; display:flex; justify-content:between; color:var(--text-dim); font-size:12px; font-family:'IBM Plex Mono', monospace;}

    /* Dynamic Registration Modal */
    .modal-backdrop{position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,19,48,0.85); backdrop-filter:blur(5px); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
    .modal-content{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); width:100%; max-width:500px; padding:32px; position:relative;}
    .close-modal{position:absolute; top:20px; right:20px; background:none; border:none; color:var(--text-dim); font-size:24px; cursor:pointer;}
    .close-modal:hover{color:var(--text);}
    .modal-content h3{font-size:26px; margin-bottom:4px;}
    .modal-subtitle{font-size:14px; color:var(--text-dim); margin-bottom:24px;}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block; font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; color:var(--teal); margin-bottom:6px;}
    .form-group input, .form-group select{width:100%; padding:12px; background:var(--bg-alt); border:1px solid var(--line); border-radius:var(--radius); color:var(--text); font-family:inherit;}
    .form-group input:focus, .form-group select:focus{outline:none; border-color:var(--teal);}
    .form-notice{background:rgba(232,162,61,0.1); border:1px solid rgba(232,162,61,0.2); padding:12px; border-radius:var(--radius); font-size:13px; color:var(--gold); margin-bottom:20px; line-height:1.4;}
    .btn-submit{width:100%; padding:14px; background:var(--gold); border:none; border-radius:var(--radius); color:var(--bg); font-family:'Anton', sans-serif; font-size:16px; text-transform:uppercase; cursor:pointer;}
    .btn-submit:hover{background:#f0b45b;}

    /* Responsive adjustment */
    @media (max-width:900px){
      .steps-grid{grid-template-columns:1fr;}
      .footer-grid{grid-template-columns:1fr; gap:24px;}
      .stats-bar{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header>
    <nav>
      <div class="brand">
        <div class="brand-mark">
          <!-- Update path inside repository -->
          <img src="images/namibian-traders-logo.png" alt="Namibian Traders Logo">
        </div>
        <div class="brand-name">Namibian Traders</div>
      </div>
      <div class="nav-links">
        <a href="#events">Events</a>
        <a href="#how-it-works">How it works</a>
        <a href="#features">Platform</a>
        <button class="btn-nav" onclick="openRegModal()">Register</button>
      </div>
    </nav>
  </header>

  <!-- Main Dynamic Wrapper -->
  <main class="wrap">
    
    <!-- Hero Block -->
    <section class="hero">
      <span class="eyebrow">Built in Windhoek, for Namibian road races</span>
      <h1>Enter a race, then know your <em>exact</em> time.</h1>
